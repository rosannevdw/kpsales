# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: user/repo

media_folder: /routes/media
public_folder: /media

collections:
  - name: posts
    label: Posts
    folder: /data/posts
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: markdown }
  - name: pillars
    label: Pillars
    folder: /data/pillars
    format: json
    fields:
      - label: Title
        name: title
        widget: string
      - name: slides
        label: slides
        widget: list
        fields:
        - { name: image, label: Image, widget: image }
        - { label: Title, name: title, widget: string }
        - { label: Body, name: body, widget: markdown }